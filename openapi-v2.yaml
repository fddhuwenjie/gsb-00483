openapi: 3.0.0
info:
  title: Pet Store API
  description: A sample API for managing a pet store
  version: 2.0.0
  contact:
    name: API Support
    email: support@petstore.com
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: pets
    description: Everything about your Pets
  - name: orders
    description: Access to store orders
  - name: users
    description: Operations about users

paths:
  /pets:
    get:
      tags:
        - pets
      summary: List all pets
      description: Returns a list of all pets
      operationId: listPets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: status
          in: query
          description: Filter pets by status
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
            default: available
        - name: category
          in: query
          description: Filter pets by category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - pets
      summary: Add a new pet
      description: Create a new pet in the store
      operationId: addPet
      requestBody:
        description: Pet object that needs to be added to the store
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pets/{petId}:
    get:
      tags:
        - pets
      summary: Get pet by ID
      description: Returns a single pet
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid ID supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - pets
      summary: Update pet
      description: Update an existing pet by ID
      operationId: updatePet
      parameters:
        - name: petId
          in: path
          description: ID of pet to update
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        description: Pet object that needs to be updated
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Pet updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid ID or input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pets/search:
    get:
      tags:
        - pets
      summary: Search pets
      description: Search pets by name or category
      operationId: searchPets
      parameters:
        - name: q
          in: query
          description: Search query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'

components:
  schemas:
    Pet:
      type: object
      required:
        - name
        - photoUrls
        - category
      properties:
        id:
          type: integer
          format: int64
          description: Pet ID
          minimum: 1
          example: 10
        name:
          type: string
          description: Pet name
          minLength: 1
          maxLength: 100
          example: 'doggie'
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          description: List of photo URLs
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: url
            example: 'https://example.com/photo.jpg'
        tags:
          type: array
          description: Tags assigned to the pet
          minItems: 0
          maxItems: 5
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: Pet status
          enum: [available, pending, sold]
          example: 'available'
          default: 'available'
        age:
          type: integer
          description: Pet age in months
          minimum: 0
          maximum: 360
          example: 24
        breed:
          type: string
          description: Pet breed
          example: 'Golden Retriever'

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: 'Dogs'

    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: 'friendly'

    Order:
      type: object
      required:
        - petId
        - quantity
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 100
        petId:
          type: integer
          format: int64
          minimum: 1
          example: 10
        quantity:
          type: integer
          description: Number of items
          minimum: 1
          maximum: 10
          example: 2
        shipDate:
          type: string
          format: date-time
          description: Shipping date
          example: '2024-01-15T10:30:00Z'
        status:
          type: string
          description: Order status
          enum: [placed, approved, delivered]
          example: 'placed'
        complete:
          type: boolean
          description: Whether the order is complete
          default: false

    User:
      type: object
      required:
        - username
        - email
        - password
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 100
        username:
          type: string
          description: Username
          pattern: '^[a-zA-Z0-9_.-]{3,20}$'
          minLength: 3
          maxLength: 20
          example: 'john_doe'
        firstName:
          type: string
          description: First name
          minLength: 1
          maxLength: 50
          example: 'John'
        lastName:
          type: string
          description: Last name
          minLength: 1
          maxLength: 50
          example: 'Doe'
        email:
          type: string
          format: email
          description: User email
          example: 'john@example.com'
        password:
          type: string
          description: User password
          minLength: 8
          maxLength: 128
          example: 'securePass123'
        phone:
          type: string
          description: Phone number
          pattern: '^\\+?[\\d\\s-]{10,20}$'
          example: '+1-555-123-4567'

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          example: 404
        message:
          type: string
          example: 'Resource not found'
        details:
          type: string

    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
